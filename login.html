<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Antifragile Cyber Labs | Acceso SOC</title>
    <!-- Estilos globales del proyecto -->
    <link rel="stylesheet" href="assets/css/global.css">
    <link rel="stylesheet" href="assets/css/login.css">
</head>
<body class="cuerpo-login">

    <div class="contenedor-login">
        <!-- Encabezado con identidad del laboratorio -->
        <div class="encabezado-login">
            <img src="assets/img/antifragile_cyber_labs_logo.png" alt="Logo Antifragile Cyber Labs" class="logo-login" width="180">
            <h2>ANTIFRAGILE CYBER LABS</h2>
            <p>Acceso Restringido - Operaciones de Red</p>
        </div>
        
        <!-- Formulario de autenticación del operador -->
        <form id="formularioLogin" class="formulario-login">
            <div class="grupo-formulario">
                <label for="usuario">Usuario Operador:</label>
                <input type="text" id="usuario" name="usuario" placeholder="Ingresa tu usuario" required autocomplete="off">
            </div>
            
            <div class="grupo-formulario">
                <label for="clave">Contraseña de Red:</label>
                <input type="password" id="clave" name="clave" placeholder="••••••••" required>
            </div>
            
            <!-- Contenedor para mensajes de validación dinámicos -->
            <div id="mensajeError" class="mensaje-error" style="display: none;"></div>

            <button type="submit" class="boton-principal">Iniciar Sesión</button>
        </form>
    </div>

    <!-- Lógica de validación de credenciales -->
    <script src="assets/js/login.js"></script>
</body>
</html>
